server:
  port: 8181

spring:
  application:
    name: hr-resume-match-api
  # 自动加载仓库根目录 / apps/api 下的 .env（IDE 直接跑也能读到 Key）
  config:
    import: optional:file:.env[.properties],optional:file:../../.env[.properties]
  datasource:
    url: jdbc:h2:file:./data/hr-resume-match;MODE=PostgreSQL;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB

app:
  upload-dir: ./uploads
  llm:
    mode: ${LLM_MODE:auto}
    openai:
      # 兼容 OPENAI_API_KEY / DEEPSEEK_API_KEY
      api-key: ${OPENAI_API_KEY:${DEEPSEEK_API_KEY:}}
      base-url: ${OPENAI_BASE_URL:${DEEPSEEK_BASE_URL:https://hub.shhdpz.cn}}
      model: ${OPENAI_MODEL:${DEEPSEEK_MODEL:gpt-5.5}}
      timeout-seconds: 90

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
